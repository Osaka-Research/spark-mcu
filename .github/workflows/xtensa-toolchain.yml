name: xtensa toolchain (Android host)

# Canadian cross:
#   build  = x86_64-linux-gnu  (GH Actions ubuntu runner)
#   host   = aarch64-linux-android  (where the toolchain binaries run — our phones)
#   target = xtensa-lx106-elf  (ESP8266) and xtensa-esp32s3-elf (ESP32-S3)
#
# Produces one tarball per target. Both are consumed by phase 2
# (prebuild Arduino core.a) and phase 3 (APK packaging). The two targets
# run as sibling jobs because their phase-A paths diverge: lx106 uses
# ct-ng's canned sample, S3 uses a direct binutils+gcc+newlib build
# pinned to Espressif's gcc 13.2 era (see firmware/toolchain/README.md).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Toolchain to build"
        type: choice
        options: [s3, lx106, all]
        default: s3
      upload_release:
        description: "Attach tarball to a GitHub release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (only used if upload_release=true)"
        type: string
        default: "toolchain-dev"
  push:
    paths:
      - ".github/workflows/xtensa-toolchain.yml"
      - "firmware/toolchain/**"

concurrency:
  group: xtensa-toolchain-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "r26d"
  ANDROID_API: "24"
  HOST_TRIPLE: "aarch64-linux-android"

jobs:
  build-lx106:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'lx106'
    runs-on: ubuntu-22.04
    env:
      TARGET: "xtensa-lx106-elf"
      PREFIX: "/opt/xtensa-lx106-elf-android"
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gperf gawk texinfo help2man \
            libtool-bin autoconf automake pkg-config \
            libncurses-dev libexpat1-dev libssl-dev zlib1g-dev \
            python3 python3-pip git wget curl xz-utils unzip ninja-build \
            qemu-user-static

      - name: Fetch Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          echo "NDK_ROOT=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache crosstool-NG source
        id: cache-ctng
        uses: actions/cache@v4
        with:
          path: ~/crosstool-ng
          key: ctng-espressif-${{ runner.os }}-v1

      - name: Build crosstool-NG (Espressif fork)
        if: steps.cache-ctng.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd ~
          git clone --depth 1 https://github.com/espressif/crosstool-NG.git crosstool-ng
          cd crosstool-ng
          ./bootstrap
          ./configure --prefix=$HOME/ctng-prefix
          make -j$(nproc)
          make install

      - name: Add ctng to PATH
        run: echo "$HOME/ctng-prefix/bin" >> $GITHUB_PATH

      - name: Phase A — native cross (x86_64 → xtensa-lx106-elf)
        # Needed first so we have a working target compiler to produce
        # target libraries (newlib) that the Canadian stage will reuse.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-a" && cd "$RUNNER_TEMP/phase-a"
          ct-ng xtensa-lx106-elf
          # Point install prefix somewhere writable
          sed -i 's|^CT_PREFIX_DIR=.*|CT_PREFIX_DIR="${HOME}/x-tools/${CT_TARGET}"|' .config
          sed -i 's|^# CT_LOG_PROGRESS_BAR is not set.*|CT_LOG_PROGRESS_BAR=n|' .config || true
          ct-ng build.$(nproc) || (tail -n 200 build.log; exit 1)
          echo "PHASE_A_PREFIX=$HOME/x-tools/xtensa-lx106-elf" >> "$GITHUB_ENV"

      - name: Phase B — Canadian cross (aarch64-android → xtensa-lx106-elf)
        run: |
          set -euo pipefail
          chmod +x firmware/toolchain/build-xtensa-android.sh
          firmware/toolchain/build-xtensa-android.sh

      - name: Smoke-test under qemu-aarch64
        # Binaries can't run natively on x86_64, but we can exec them via qemu-user
        # against the Android sysroot's dynamic linker to confirm linkage.
        continue-on-error: true
        run: |
          set -euo pipefail
          BIN="$PREFIX/bin/xtensa-lx106-elf-gcc"
          SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          qemu-aarch64-static -L "$SYSROOT" "$BIN" --version || echo "qemu smoke-test failed (non-fatal)"

      - name: Package tarball
        run: |
          set -euo pipefail
          cd "$(dirname "$PREFIX")"
          tar -cJf "$RUNNER_TEMP/xtensa-lx106-elf-android-arm64.tar.xz" "$(basename "$PREFIX")"
          ls -lh "$RUNNER_TEMP/xtensa-lx106-elf-android-arm64.tar.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtensa-lx106-elf-android-arm64
          path: ${{ runner.temp }}/xtensa-lx106-elf-android-arm64.tar.xz
          retention-days: 30

      - name: Attach to release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ runner.temp }}/xtensa-lx106-elf-android-arm64.tar.xz
          fail_on_unmatched_files: true

  build-s3:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 's3'
    runs-on: ubuntu-22.04
    env:
      TARGET: "xtensa-esp32s3-elf"
      PREFIX: "/opt/xtensa-esp32s3-elf-android"
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gperf gawk texinfo help2man \
            libtool-bin autoconf automake pkg-config \
            libncurses-dev libexpat1-dev libssl-dev zlib1g-dev \
            python3 python3-pip git wget curl xz-utils unzip ninja-build \
            qemu-user-static

      - name: Fetch Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          echo "NDK_ROOT=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache S3 native cross
        id: cache-s3-a
        uses: actions/cache@v4
        with:
          path: ~/x-tools/xtensa-esp32s3-elf
          key: s3-phase-a-esp-13.2.0-20240530-overlay-v2

      - name: Phase A — native cross (x86_64 → xtensa-esp32s3-elf)
        if: steps.cache-s3-a.outputs.cache-hit != 'true'
        # No ct-ng sample for S3's gcc-13.2 era; we drive binutils/gcc/newlib
        # directly so phase B can copy target libs out of PHASE_A_PREFIX.
        run: |
          set -euo pipefail
          export PHASE_A_PREFIX="$HOME/x-tools/xtensa-esp32s3-elf"
          mkdir -p "$PHASE_A_PREFIX"
          chmod +x firmware/toolchain/build-xtensa-s3-phase-a.sh
          firmware/toolchain/build-xtensa-s3-phase-a.sh

      - name: Export S3 native cross path
        run: echo "PHASE_A_PREFIX=$HOME/x-tools/xtensa-esp32s3-elf" >> "$GITHUB_ENV"

      - name: Phase B — Canadian cross (aarch64-android → xtensa-esp32s3-elf)
        run: |
          set -euo pipefail
          chmod +x firmware/toolchain/build-xtensa-s3-android.sh
          firmware/toolchain/build-xtensa-s3-android.sh

      - name: Smoke-test under qemu-aarch64
        continue-on-error: true
        run: |
          set -euo pipefail
          BIN="$PREFIX/bin/xtensa-esp32s3-elf-gcc"
          SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          qemu-aarch64-static -L "$SYSROOT" "$BIN" --version || echo "qemu smoke-test failed (non-fatal)"

      - name: Stage Arduino-ESP32 S3 core and SDK
        run: bash firmware/toolchain/stage-arduino-s3.sh

      - name: Package tarball
        run: |
          set -euo pipefail
          test -x "$PREFIX/bin/$TARGET-gcc"
          test -x "$PREFIX/bin/$TARGET-g++"
          test -d "$PREFIX/$TARGET/include"
          test -d "$PREFIX/$TARGET/lib"
          cd "$PREFIX"
          test -f "$PREFIX/arduino-core-esp32/prebuilt/core.a"
          cp "$NDK_ROOT/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so" "$PREFIX/libc++_shared.so"
          tar --hard-dereference -cJf "$RUNNER_TEMP/xtensa-esp32s3-elf-android-arm64.tar.xz" bin "$TARGET" lib libexec arduino-core-esp32 libc++_shared.so
          tar -tJf "$RUNNER_TEMP/xtensa-esp32s3-elf-android-arm64.tar.xz" | sed -n '1,20p'
          ls -lh "$RUNNER_TEMP/xtensa-esp32s3-elf-android-arm64.tar.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtensa-esp32s3-elf-android-arm64
          path: ${{ runner.temp }}/xtensa-esp32s3-elf-android-arm64.tar.xz
          retention-days: 30

      - name: Attach to release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ runner.temp }}/xtensa-esp32s3-elf-android-arm64.tar.xz
          fail_on_unmatched_files: true
