; spark-mcu firmware
; Builds for ESP32 and ESP8266/NodeMCU from the same sources.

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager@^2.0.17
    madhephaestus/ESP32Servo@^3.0.5

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -DSPARK_BOARD_ESP32

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
build_flags = -DSPARK_BOARD_ESP8266
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager@^2.0.17
