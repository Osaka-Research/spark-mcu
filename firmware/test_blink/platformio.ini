; spark-mcu · test_blink
; Minimal blink sketch for verifying the USB flasher in the Android app.
; Build: pio run -e esp32dev   (or -e nodemcuv2)
; Output .bin: .pio/build/<env>/firmware.bin

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -DLED_PIN=2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
build_flags = -DLED_PIN=2
