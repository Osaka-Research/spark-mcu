org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2

# --- xtensa toolchain fetcher ---
# GH repo that hosts the release tarball (same org/repo by default).
spark.toolchain.githubRepo=Osaka-Research/spark-mcu
# Release tag to pull from. Flip this between bootstrap tarballs and the
# clean Canadian-cross output; the fetcher is source-agnostic.
spark.toolchain.releaseTag=toolchain-bootstrap-dev
# Tarball filename within the release. Both bootstrap and Canadian cross
# produce the same filename on purpose.
spark.toolchain.asset=xtensa-lx106-elf-android-arm64.tar.xz
# Set to true to skip fetch (useful in CI when the tarball is injected
# directly or when working offline with a pre-populated jniLibs tree).
spark.toolchain.skipFetch=false
